services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: ./server
    ports:
      - "8088:8088"
    env_file:
      - ./server/.env
    environment:
      # Override the localhost values from .env to point at the other
      # containers on the compose network instead.
      - DB_CONNECTION_URL=mongodb://mongo:27017/writify
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
